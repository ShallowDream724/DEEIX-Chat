name: Image

# Builds the runtime image once per architecture and publishes it to GHCR and, when its secrets are
# configured, Docker Hub.
#
#   * One build serves both registries. They used to be two workflows that built the very same image
#     independently, so every push paid for four builds instead of two.
#   * The Dockerfile keeps its dependency and compiler caches (pnpm store, Go module and build caches)
#     in BuildKit cache mounts. Those live inside the builder and vanish with a GitHub-hosted runner,
#     so every run used to download and compile from scratch. They are saved to and restored from
#     actions/cache around the build (buildkit-cache-dance), the approach the Docker documentation
#     recommends for cache mounts in GitHub Actions. The Dockerfile itself stays the single build
#     path: `docker build .` and this workflow produce the same image.
#   * The layer cache is exported with mode=min (final stage only). With the cache mounts restored,
#     intermediate layers are cheap to rebuild and not worth the repository cache quota.

on:
  push:
    branches:
      - main
      - dev
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      architecture:
        description: Image architecture
        type: choice
        options: [both, amd64, arm64]
        default: both
      publish_latest:
        description: Update latest for the ShallowDream724 fork after validation
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ${{ matrix.arch == 'amd64' && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(inputs.architecture == 'amd64' && '["amd64"]' || inputs.architecture == 'arm64' && '["arm64"]' || '["amd64","arm64"]') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4

      # The download and compile caches are the expensive part of a cold build (measured without
      # them: pnpm install 157s, go mod download 104s, go build 32s). The Turbopack cache is left out:
      # a cold Next build takes about 20s and the cache would cost ~1 GB of the repository quota.
      # Keyed on the lockfiles, which is when dependencies change; the Go build cache is
      # content-addressed, so restoring an older one still saves most of the compile.
      - name: Cache BuildKit cache mounts
        id: mounts
        uses: actions/cache@v5
        with:
          path: |
            buildkit-cache/pnpm-store
            buildkit-cache/go-mod
            buildkit-cache/go-build
          key: image-mounts-${{ matrix.arch }}-${{ hashFiles('pnpm-lock.yaml', 'backend/go.sum') }}
          restore-keys: |
            image-mounts-${{ matrix.arch }}-

      # Copies the restored directories into the builder's cache mounts before the build and back out
      # afterwards. Ids and targets must match the RUN --mount flags in the Dockerfile.
      - name: Inject cache mounts into the builder
        uses: reproducible-containers/buildkit-cache-dance@v3
        with:
          builder: ${{ steps.buildx.outputs.name }}
          cache-map: |
            {
              "buildkit-cache/pnpm-store": { "target": "/pnpm/store", "id": "pnpm-store" },
              "buildkit-cache/go-mod": { "target": "/go/pkg/mod", "id": "go-mod" },
              "buildkit-cache/go-build": { "target": "/root/.cache/go-build", "id": "go-build" }
            }
          skip-extraction: ${{ steps.mounts.outputs.cache-hit }}

      # Docker Hub is optional: without its secrets the image is still published to GHCR.
      - name: Resolve image names
        id: image
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          repository=$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          images="ghcr.io/$repository"
          if [[ -n "$DOCKERHUB_TOKEN" ]]; then
            namespace=$(printf '%s' "${DOCKERHUB_USERNAME:-${GITHUB_REPOSITORY_OWNER}}" | tr '[:upper:]' '[:lower:]')
            images+=$'\n'"$namespace/${repository#*/}"
            echo "dockerhub=true" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "images<<__EOF__"
            echo "$images"
            echo "__EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.images }}
          tags: |
            type=ref,event=branch,suffix=-${{ matrix.arch }}
            # Tag refs arrive either as pushes or via workflow_dispatch from Release Tag.
            type=raw,value=${{ github.ref_name }},suffix=-${{ matrix.arch }},enable=${{ github.ref_type == 'tag' }}
            type=sha,format=long,suffix=-${{ matrix.arch }}
            type=raw,value=latest-${{ matrix.arch }},enable=${{ github.ref == 'refs/heads/main' || (github.repository == 'ShallowDream724/DEEIX-Chat' && inputs.publish_latest) }}

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: steps.image.outputs.dockerhub == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            REFRESH_CATALOG_SNAPSHOTS=true
          cache-from: type=gha,scope=image-${{ matrix.arch }}
          cache-to: type=gha,scope=image-${{ matrix.arch }},mode=min

      - name: Smoke test published architecture
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          repository=$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          image="ghcr.io/$repository@$IMAGE_DIGEST"
          docker pull "$image"
          trap 'docker rm -f deeix-image-smoke >/dev/null 2>&1 || true' EXIT
          export JWT_SECRET="$(openssl rand -hex 32)"
          export DATA_ENCRYPTION_KEY="$(openssl rand -hex 32)"
          docker run -d --name deeix-image-smoke -p 127.0.0.1:18080:8080 \
            -e DATABASE_DRIVER=sqlite -e SQLITE_PATH=/app/data/smoke.db \
            -e CACHE_DRIVER=memory -e JWT_SECRET -e DATA_ENCRYPTION_KEY "$image"
          ready=false
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18080/healthz >/dev/null; then ready=true; break; fi
            sleep 1
          done
          if [[ "$ready" != true ]]; then docker logs deeix-image-smoke; exit 1; fi
          curl -fsS http://127.0.0.1:18080/ > "$RUNNER_TEMP/deeix-index.html"
          grep -qi '<!DOCTYPE html>' "$RUNNER_TEMP/deeix-index.html"
          revision=$(docker inspect deeix-image-smoke --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')
          [[ "$revision" == "$GITHUB_SHA" ]]

  merge:
    name: Merge
    needs:
      - build
    runs-on: ubuntu-latest

    steps:
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Resolve image names
        id: image
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          repository=$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          images="ghcr.io/$repository"
          if [[ -n "$DOCKERHUB_TOKEN" ]]; then
            namespace=$(printf '%s' "${DOCKERHUB_USERNAME:-${GITHUB_REPOSITORY_OWNER}}" | tr '[:upper:]' '[:lower:]')
            images+=$'\n'"$namespace/${repository#*/}"
            echo "dockerhub=true" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "images<<__EOF__"
            echo "$images"
            echo "__EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.images }}
          tags: |
            type=ref,event=branch
            type=raw,value=${{ github.ref_name }},enable=${{ github.ref_type == 'tag' }}
            type=sha,format=long
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || (github.repository == 'ShallowDream724/DEEIX-Chat' && inputs.publish_latest) }}

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: steps.image.outputs.dockerhub == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create manifest lists
        env:
          IMAGE_ARCHITECTURE: ${{ inputs.architecture || 'both' }}
        run: |
          set -euo pipefail
          jq -cr '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON" | while read -r tag; do
            sources=()
            if [[ "$IMAGE_ARCHITECTURE" != "arm64" ]]; then sources+=("${tag}-amd64"); fi
            if [[ "$IMAGE_ARCHITECTURE" != "amd64" ]]; then sources+=("${tag}-arm64"); fi
            docker buildx imagetools create -t "$tag" "${sources[@]}"
          done

      - name: Inspect images
        run: |
          set -euo pipefail
          jq -cr '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON" | while read -r tag; do
            docker buildx imagetools inspect "$tag"
          done
