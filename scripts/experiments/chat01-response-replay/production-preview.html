<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Chat01 生产分类回放</title>
<style>
:root{color-scheme:light dark;--background:#fafafa;--foreground:#202124;--muted:#f0f0ef;--muted-foreground:#737373;--border:#dededb;--accent:#e8e8e5;--link:#27634c;font:14px/1.65 system-ui,-apple-system,"Segoe UI",sans-serif}
@media(prefers-color-scheme:dark){:root{--background:#191a1b;--foreground:#e8e8e6;--muted:#242526;--muted-foreground:#a2a2a0;--border:#383939;--accent:#343536;--link:#8dc8ad}}
*{box-sizing:border-box}body{margin:0;background:var(--background);color:var(--foreground)}main{max-width:1060px;padding:24px 28px 64px;margin:auto;min-width:0}h1{font-size:17px;font-weight:600;margin:0}header{border-bottom:1px solid var(--border);padding-bottom:16px}p{margin:9px 0}.muted{color:var(--muted-foreground);font-size:12px}.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:14px 0 9px}.grow{flex:1;min-width:180px}button,select{border:1px solid var(--border);border-radius:6px;background:var(--background);color:var(--foreground);padding:5px 10px;font:inherit;font-size:12px;min-height:30px;max-width:100%}button{cursor:pointer}button:hover{background:var(--accent)}button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--link);outline-offset:3px}select{width:100%;text-overflow:ellipsis}label{display:block}input[type=range]{width:100%;accent-color:var(--link);margin:6px 0}.stats{display:flex;flex-wrap:wrap;gap:4px 16px;color:var(--muted-foreground);font-size:12px;font-variant-numeric:tabular-nums}.content{min-width:0;overflow-wrap:anywhere}.content h2,.content h3,.content h4{font-size:15px;line-height:1.6;margin:15px 0 6px;font-weight:600}.stage{padding:10px 0;border-bottom:1px solid var(--border)}.stage:last-child{border-bottom:0}.process{margin:10px 0;padding:4px 0}.process>summary{font-size:13px;color:var(--muted-foreground);cursor:pointer}.process>div{padding:8px 0 0 14px;min-width:0}pre{white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word;background:var(--muted);padding:10px 12px;border-radius:6px;font:12px/1.65 ui-monospace,SFMono-Regular,Consolas,monospace;max-height:440px;overflow:auto;min-width:0}code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:.9em}a{color:var(--link);text-decoration:underline;text-underline-offset:3px;overflow-wrap:anywhere}figure{margin:14px 0}figure img{display:block;max-width:100%;max-height:540px;object-fit:contain;border-radius:6px;background:var(--muted)}figcaption{font-size:12px;color:var(--muted-foreground);margin-top:5px}.files{margin:14px 0}.file{display:flex;align-items:center;gap:10px;border-top:1px solid var(--border);padding:10px 0;min-width:0}.file .mark{display:grid;place-items:center;width:34px;height:34px;flex-shrink:0;background:var(--muted);border-radius:6px;font-size:10px;font-weight:600}.file a,.file span{min-width:0}.raw-section{border-top:1px solid var(--border);margin-top:24px;padding-top:12px}.raw-section>summary{cursor:pointer;color:var(--muted-foreground);font-size:12px}.raw-section pre{max-height:560px}.table-wrap{width:100%;overflow-x:auto}table{border-collapse:collapse;font-size:12px;min-width:480px;width:100%;margin:10px 0}td,th{border-bottom:1px solid var(--border);padding:7px 9px;text-align:left;vertical-align:top}th{font-weight:600;background:var(--muted)}.empty{padding:28px 0;color:var(--muted-foreground)}.version{font-family:ui-monospace,Consolas,monospace;font-size:11px;overflow-wrap:anywhere;margin-top:5px}.speed{width:100px}.break{height:4px}@media(max-width:520px){main{padding:16px 14px 40px}.grow{flex-basis:100%;min-width:0}.toolbar{gap:6px}button{padding:5px 8px}.stats{gap:4px 10px}.process>div{padding-left:8px}figure img{max-height:360px}}
</style>
</head>
<body><main>
<header><h1>Chat01 生产分类回放</h1><div class="muted version" id="version"></div></header>
<div class="toolbar"><label class="grow"><select id="sample" aria-label="真实抓包样本"></select></label><button id="play" type="button">重新回放</button><button id="step" type="button">下一段</button><button id="end" type="button">完整结果</button><label><select id="speed" class="speed" aria-label="回放速度"><option value="1">1× 速度</option><option value="8">8× 速度</option><option value="16" selected>16× 速度</option><option value="64">64× 速度</option></select></label></div>
<label class="muted" for="position">接收进度 <span id="progress"></span></label><input id="position" type="range" min="0" step="1" value="0">
<div class="stats" id="stats" aria-live="polite"></div>
<div id="output" class="content"></div>
<details class="raw-section"><summary>原始返回对照</summary><pre id="raw"></pre></details>
<details class="raw-section"><summary>私有控制块与分段标记</summary><div id="controls"></div></details>
<details class="raw-section"><summary>生产分类结果与资源证据</summary><pre id="evidence"></pre></details>
</main><script>
(() => {
  "use strict";
  const data = __PRODUCTION_DATA__;
  const $ = id => document.getElementById(id);
  const labels = {reasoning:"思考",python:"代码执行",shell:"命令记录",search:"联网搜索","code-fragment":"执行片段","tool-note":"工具记录",component:"组件片段"};
  let active=0,index=0,timer=null,blocks=new Map(),received="",finished=false;
  const node = (tag,value="",cls="") => {const element=document.createElement(tag);element.textContent=value;if(cls)element.className=cls;return element;};
  const safeURL = raw => {try{const url=new URL(raw);return ["http:","https:"].includes(url.protocol)&&!url.username&&!url.password?url.href:"";}catch{return "";}};
  function link(label,href){const url=safeURL(href);if(!url)return node("span",label+(href.startsWith("sandbox:/")?"（上游返回的下载地址无效）":""));const a=node("a",label);a.href=url;a.target="_blank";a.rel="noopener noreferrer";return a;}
  function image(parent,label,href){const url=safeURL(href);if(!url){parent.append(link(label,href));return;}const figure=node("figure"),a=link("",url),img=document.createElement("img");img.src=url;img.alt=label||"图片";img.loading="lazy";img.decoding="async";img.referrerPolicy="no-referrer";img.addEventListener("error",()=>{img.replaceWith(node("span","图片暂时无法加载","muted"));},{once:true});a.append(img);figure.append(a);if(label)figure.append(node("figcaption",label));parent.append(figure);}
  // Markdown display only. Block categories, source identity and component fallbacks come from Go.
  function inline(parent,text){const pattern=/(!?)\[([^\]\n]*)\]\(([^\s)]+)\)|\*\*([^*]+)\*\*|`([^`]+)`/g;let end=0;for(const match of text.matchAll(pattern)){parent.append(document.createTextNode(text.slice(end,match.index)));if(match[3]){if(match[1])image(parent,match[2],match[3]);else parent.append(link(match[2],match[3]));}else parent.append(node(match[4]?"strong":"code",match[4]||match[5]));end=match.index+match[0].length;}parent.append(document.createTextNode(text.slice(end)));}
  function markdown(parent,text){let fence=null,pre=null;const lines=text.trim().split("\n");for(let i=0;i<lines.length;i++){const line=lines[i],marker=line.match(/^ {0,3}(`{3,}|~{3,})(.*)$/);if(marker&&!fence){fence={char:marker[1][0],length:marker[1].length};pre=node("pre");parent.append(pre);continue;}if(marker&&fence&&marker[1][0]===fence.char&&marker[1].length>=fence.length&&!marker[2].trim()){fence=null;continue;}if(fence){pre.append(document.createTextNode(line+"\n"));continue;}if(!line.trim())continue;if(line.includes("|")&&i+1<lines.length&&/^\s*\|?\s*:?-{3,}/.test(lines[i+1])){const wrap=node("div","","table-wrap"),table=node("table");const row=(value,head)=>{const tr=node("tr");for(const cell of value.replace(/^\s*\|/u,"").replace(/\|\s*$/u,"").split("|")){const td=node(head?"th":"td");inline(td,cell.trim());tr.append(td);}table.append(tr);};row(line,true);i++;while(i+1<lines.length&&lines[i+1].includes("|")&&lines[i+1].trim()){row(lines[++i],false);}wrap.append(table);parent.append(wrap);continue;}const heading=line.match(/^(#{1,6})\s+(.+)/),target=node(heading?"h3":"p");inline(target,heading?heading[2]:line);parent.append(target);}}
  function apply(deltas){for(const delta of deltas||[]){let block=blocks.get(delta.blockId);if(!block){block={id:delta.blockId,kind:delta.kind,text:"",start:delta.start,section:delta.section};blocks.set(block.id,block);}block.text+=delta.text;block.end=delta.end;block.reason=delta.reason||block.reason;block.complete=delta.complete||false;block.oversized=delta.oversized||false;}}
  function finalize(){if(!finished&&index===data.cases[active].frames.length){apply(data.cases[active].finish);finished=true;}}
  function seek(position){blocks=new Map();received="";index=0;finished=false;while(index<position){const frame=data.cases[active].frames[index++];received+=frame.text;apply(frame.deltas);}finalize();render();}
  function stop(){if(timer!==null)clearTimeout(timer);timer=null;}
  function render(){const sample=data.cases[active],output=$("output"),controls=$("controls");const opened=new Set([...output.querySelectorAll("details[open]")].map(item=>item.dataset.id));output.replaceChildren();controls.replaceChildren();const sections=new Set();let toolCount=0;for(const block of blocks.values()){if(!block.text.trim())continue;if(["control","meta"].includes(block.kind)){controls.append(node("p",`${block.start}–${block.end} · ${block.reason||block.kind}`,"muted"),node("pre",block.text));continue;}if(block.kind==="answer"){sections.add(block.section);const stage=node("section","","stage");markdown(stage,block.text);output.append(stage);continue;}if(block.kind==="component"){const finalBlock=sample.blocks.find(item=>item.id===block.id);if(finalBlock&&block.text===finalBlock.text&&sample.componentFallback[block.id]){const stage=node("section","","stage");markdown(stage,sample.componentFallback[block.id]);output.append(stage);}}else if(["python","shell","code-fragment","search","tool-note"].includes(block.kind))toolCount++;const detail=node("details","","process");detail.dataset.id=block.id;detail.open=opened.has(block.id);detail.append(node("summary",labels[block.kind]||block.kind));const content=node("div");if(["python","shell","code-fragment","component"].includes(block.kind))content.append(node("pre",block.text));else markdown(content,block.text);detail.append(content);output.append(detail);}
    const visibleResources=(sample.resources||[]).filter(resource=>(blocks.get(resource.blockId)?.end??-1)>=resource.end);const files=new Map();for(const resource of visibleResources){if(["file","unavailable"].includes(resource.kind))files.set(resource.url,resource);}if(files.size){const area=node("div","","files");for(const file of files.values()){const row=node("div","","file"),mark=node("span",(file.name.split(".").at(-1)||"FILE").slice(0,6).toUpperCase(),"mark");row.append(mark,link(file.title||file.name||"文件",file.url));area.append(row);}output.append(area);}
    if(!output.childNodes.length)output.append(node("p",index?"等待正文内容":"等待接收","empty"));$("raw").textContent=received;$("position").value=index;$("progress").textContent=`${index} / ${sample.frames.length} 段`;
    $("stats").replaceChildren(node("span",`正文 ${sections.size} 段 · 工具记录 ${toolCount} · 文件 ${files.size}`),node("span",`抓包时刻 ${sample.frames[Math.max(0,index-1)]?.t||0}s`),node("span",finished?(sample.done||sample.finishReason?"返回已结束 · 原文保全通过":"抓包截断 · 保留已收到内容"):"接收中"));
    $("evidence").textContent=JSON.stringify({parserVersion:data.parserVersion,sourceSHA256:data.sourceSHA256,source:sample.source,blocks:[...blocks.values()].map(({text,...block})=>({...block,characters:text.length})),resources:visibleResources},null,2);$("play").textContent=timer!==null?"暂停":finished?"重新回放":"继续回放";}
  function tick(){const sample=data.cases[active];if(index>=sample.frames.length){stop();finalize();render();return;}const frame=sample.frames[index++];received+=frame.text;apply(frame.deltas);finalize();if(finished){stop();render();return;}const delay=Math.max(30,Math.min(600,(sample.frames[index].t-frame.t)*1000/Number($("speed").value)));timer=setTimeout(tick,delay);render();}
  data.cases.forEach((sample,i)=>{const option=node("option",sample.name);option.value=i;$("sample").append(option);});
  $("sample").addEventListener("change",()=>{stop();active=Number($("sample").value);$("position").max=data.cases[active].frames.length;seek(data.cases[active].frames.length);});
  $("position").addEventListener("input",()=>{stop();seek(Number($("position").value));});
  $("play").addEventListener("click",()=>{if(timer!==null){stop();render();return;}if(finished)seek(0);timer=setTimeout(tick,30);render();});
  $("step").addEventListener("click",()=>{stop();seek(Math.min(index+1,data.cases[active].frames.length));});
  $("end").addEventListener("click",()=>{stop();seek(data.cases[active].frames.length);});
  $("version").textContent=`${data.parserVersion} · ${data.goVersion} · 源码 SHA256 ${data.sourceSHA256.slice(0,16)}`;$("position").max=data.cases[0].frames.length;seek(data.cases[0].frames.length);
})();
</script></body></html>
